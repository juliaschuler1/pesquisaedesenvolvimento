<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Beauty Development Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23FCE4EC'/%3E%3Cpath d='M20 8c4.6 6 8 10.3 8 14.6A8 8 0 0 1 12 22.6C12 18.3 15.4 14 20 8Z' fill='%23E9A8C2'/%3E%3Cpath d='M20 14.5c2.6 3.4 4.4 5.9 4.4 8.3a4.4 4.4 0 0 1-8.8 0c0-2.4 1.8-4.9 4.4-8.3Z' fill='%23B76E8C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Menu principal">
    <a class="brand" href="#/">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#FCE4EC"/><path d="M20 8c4.6 6 8 10.3 8 14.6A8 8 0 0 1 12 22.6C12 18.3 15.4 14 20 8Z" fill="#E9A8C2"/><path d="M20 14.5c2.6 3.4 4.4 5.9 4.4 8.3a4.4 4.4 0 0 1-8.8 0c0-2.4 1.8-4.9 4.4-8.3Z" fill="#B76E8C"/><circle cx="17.6" cy="20.4" r="1.3" fill="#fff" opacity=".85"/></svg>
      <span><b>Beauty Development Studio</b><small>Da concepção ao lançamento</small></span>
    </a>
    <nav id="nav"></nav>
    <p class="side-note">Seus dados ficam guardados neste navegador. Faça backup em <a href="#/dados">Dados e backup</a>.</p>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
      <div class="search">
        <input id="gsearch" type="search" placeholder="Buscar projetos, fornecedores, clientes…" aria-label="Busca" autocomplete="off">
        <div class="results" id="gresults" hidden></div>
      </div>
      <div class="create">
        <button class="btn" id="createBtn" aria-haspopup="menu" aria-expanded="false">+ Criar</button>
        <div class="menu" id="createMenu" role="menu" hidden>
          <button role="menuitem" data-new="projetos">Novo projeto</button>
          <button role="menuitem" data-new="atividades">Nova atividade</button>
          <button role="menuitem" data-new="fornecedores">Novo fornecedor</button>
          <button role="menuitem" data-new="clientes">Novo cliente</button>
          <button role="menuitem" data-new="embalagens">Nova embalagem</button>
        </div>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="vendor/read-excel-file.min.js"></script>
<script src="app.js"></script>
</body>
</html>

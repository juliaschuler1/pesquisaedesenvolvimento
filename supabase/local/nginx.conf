# Gateway local: replica as rotas da API do Supabase hospedado.
server {
  listen 8000;
  client_max_body_size 60m;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  # O storage-api não responde a CORS sozinho (no Supabase hospedado o gateway faz isso).
  location /storage/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-upsert, cache-control, x-supabase-api-version" always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Expose-Headers "content-length, content-type, etag" always;
    proxy_pass http://storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
  }
}

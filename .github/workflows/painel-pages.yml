# Publica o painel pessoal (ramo gh-pages) no GitHub Pages.
# Use quando Settings → Pages → Source estiver em "GitHub Actions".
# Roda sozinho a cada envio ao main e pode ser rodado à mão em Actions → "Publicar painel" → Run workflow.
name: Publicar painel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
